<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1560" viewBox="0 0 2240 1560" role="img" aria-labelledby="title desc">
  <title id="title">MSGC FreeManager：堆、Segment、Shard、位图与分配回收流程</title>
  <desc id="desc">图示固定虚拟堆的已提交 Segment 如何归属 FreeManager shard；每个 OwnedSegmentView 如何以 allocation 与 scavenged 位图、chunk summary 管理 Region；并展示 TakeRegions 分配、Reclaim 归还和后台 Scavenge 释放物理页的闭环。</desc>
  <defs>
    <style>
      .title { font: 700 38px Arial, PingFang SC, sans-serif; fill: #102d63; }
      .subtitle { font: 400 18px Arial, PingFang SC, sans-serif; fill: #49617f; }
      .section { font: 700 22px Arial, PingFang SC, sans-serif; fill: #102d63; }
      .label { font: 700 18px Arial, PingFang SC, sans-serif; fill: #102d63; }
      .text { font: 400 16px Arial, PingFang SC, sans-serif; fill: #29415f; }
      .small { font: 400 14px Arial, PingFang SC, sans-serif; fill: #49617f; }
      .mono { font: 600 15px Menlo, Consolas, monospace; fill: #163861; }
      .monoSmall { font: 600 13px Menlo, Consolas, monospace; fill: #163861; }
      .center { text-anchor: middle; }
      .heap { fill: #f8fbff; stroke: #102d63; stroke-width: 2.5; }
      .commit { fill: #edf5ff; stroke: #2472d3; stroke-width: 2.2; }
      .reserve { fill: #fbfcfe; stroke: #9eb5ce; stroke-width: 2; stroke-dasharray: 8 6; }
      .segment0 { fill: #eaf3ff; stroke: #2472d3; stroke-width: 2; }
      .segment1 { fill: #eef8f1; stroke: #2d8a57; stroke-width: 2; }
      .segment2 { fill: #fff6e8; stroke: #e6a21c; stroke-width: 2; }
      .panel { fill: #f9fbfe; stroke: #a8bbd1; stroke-width: 2; }
      .shard { fill: #f1f7ff; stroke: #2472d3; stroke-width: 2; }
      .view { fill: #f1fbf4; stroke: #2d8a57; stroke-width: 2.5; }
      .note { fill: #fffaf0; stroke: #e6a21c; stroke-width: 2; }
      .callout { fill: #f7f2fb; stroke: #8663ab; stroke-width: 2; }
      .request { fill: #edf5ff; stroke: #2472d3; stroke-width: 2.2; }
      .free { fill: #e7eaee; stroke: #66788d; stroke-width: 2; }
      .used { fill: #357fd3; stroke: #1c5da5; stroke-width: 2; }
      .scavenged { fill: #dff2e5; stroke: #2d8a57; stroke-width: 2; }
      .summary { fill: #fff3e7; stroke: #e87505; stroke-width: 1.8; }
      .line { fill: none; stroke: #49617f; stroke-width: 2.5; marker-end: url(#arrow); }
      .blue { fill: none; stroke: #2472d3; stroke-width: 3; marker-end: url(#arrowBlue); }
      .green { fill: none; stroke: #2d8a57; stroke-width: 3; marker-end: url(#arrowGreen); }
      .orange { fill: none; stroke: #e87505; stroke-width: 3; marker-end: url(#arrowOrange); }
      .purple { fill: none; stroke: #8663ab; stroke-width: 3; marker-end: url(#arrowPurple); }
      .dash { fill: none; stroke: #7698bf; stroke-width: 2.2; stroke-dasharray: 8 7; }
      .sep { fill: none; stroke: #9eb5ce; stroke-width: 2; stroke-dasharray: 10 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#49617f"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2472d3"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2d8a57"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e87505"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8663ab"/></marker>
  </defs>

  <rect width="2240" height="1560" fill="#ffffff"/>
  <text x="70" y="58" class="title">FreeManager：堆层级、Segment/Shard 元数据、位图与页回收闭环</text>
  <text x="70" y="93" class="subtitle">它管理的是固定地址堆中“哪些 Region 可再发放”以及“空闲页是否仍驻留”；对象槽、size class 与 mark bitmap 仍属于上层 Region/中央池。</text>

  <text x="70" y="142" class="section">1. 从固定虚拟堆到 Segment owner：FreeManager 只管理 committed prefix</text>
  <rect x="70" y="165" width="2100" height="254" rx="15" class="heap"/>
  <text x="110" y="198" class="label">最大虚拟堆（地址范围预留且稳定）</text>
  <rect x="100" y="221" width="1270" height="155" rx="10" class="commit"/>
  <text x="125" y="251" class="label">committed prefix：已建立 OwnedSegmentView，当前可 Take / Reclaim / Scavenge</text>
  <rect x="1370" y="221" width="770" height="155" rx="10" class="reserve"/>
  <text x="1755" y="284" class="label center">reserved tail</text>
  <text x="1755" y="313" class="small center">仅保留虚拟地址；Grow 才追加 Segment 并初始化元数据</text>
  <line x1="1370" y1="213" x2="1370" y2="384" stroke="#2472d3" stroke-width="3"/>
  <text x="1370" y="403" class="mono center">committedEnd</text>

  <rect x="130" y="283" width="270" height="67" rx="8" class="segment0"/>
  <text x="265" y="309" class="label center">Segment 0 · owner Shard 0</text>
  <text x="265" y="334" class="small center">64 MB = 2048 × 32 KiB Region</text>
  <rect x="425" y="283" width="270" height="67" rx="8" class="segment1"/>
  <text x="560" y="309" class="label center">Segment 1 · owner Shard 1</text>
  <text x="560" y="334" class="small center">segmentOwnerShard_[1] = 1</text>
  <rect x="720" y="283" width="270" height="67" rx="8" class="segment2"/>
  <text x="855" y="309" class="label center">Segment 2 · owner Shard 2</text>
  <text x="855" y="334" class="small center">连续 span 必须落在真实 free run</text>
  <rect x="1015" y="283" width="320" height="67" rx="8" class="segment0"/>
  <text x="1175" y="309" class="label center">Segment …</text>
  <text x="1175" y="334" class="small center">每段 owner 在 committed 生命周期内固定</text>
  <text x="110" y="395" class="small">Grow：在 growMutex 下向 committedEnd 追加一个或多个 Segment，归属请求方 home shard；不会搬动既有 Segment/Region。</text>

  <text x="70" y="471" class="section">2. Shard 与 OwnedSegmentView：位图是 page-heap 的真值，summary 只用于加速查找</text>
  <rect x="70" y="495" width="2100" height="425" rx="15" class="panel"/>

  <rect x="105" y="535" width="410" height="330" rx="13" class="shard"/>
  <text x="310" y="571" class="label center">FreeManagerShard 1（一个逻辑 owner）</text>
  <text x="135" y="611" class="mono">shardMutex_</text><text x="310" y="611" class="text">串行保护本 shard 的 view 与计数</text>
  <text x="135" y="645" class="mono">ownedSegments_</text><text x="310" y="645" class="text">Segment 1、…</text>
  <text x="135" y="679" class="mono">borrowedSpans_</text><text x="310" y="679" class="text">借给 receiver 的余量；不迁移 owner</text>
  <text x="135" y="713" class="mono">takeCursor_</text><text x="310" y="713" class="text">本地分配扫描起点</text>
  <text x="135" y="747" class="mono">reclaimCursor_</text><text x="310" y="747" class="text">归还区优先扫描起点</text>
  <text x="135" y="781" class="mono">snapFree / Scav / Hot</text><text x="310" y="781" class="text">无锁容量观测</text>
  <text x="135" y="821" class="small">single Region：最多向两个 donor 批量 steal</text>
  <text x="135" y="844" class="small">连续 span：仅借用，不改变 Segment owner。</text>

  <rect x="570" y="535" width="975" height="330" rx="13" class="view"/>
  <text x="1057" y="571" class="label center">OwnedSegmentView（Segment 1，Region [2048, 4096)）</text>
  <text x="600" y="608" class="small">一个完整 Segment 的 view 含 2048 个 Region；下方用 R0…R7 表示 segment-local index。</text>
  <text x="608" y="658" class="label">Region</text>
  <g>
    <rect x="705" y="628" width="74" height="53" rx="6" class="used"/><text x="742" y="660" class="label center" style="fill:#fff">R0</text>
    <rect x="792" y="628" width="74" height="53" rx="6" class="free"/><text x="829" y="660" class="label center">R1</text>
    <rect x="879" y="628" width="74" height="53" rx="6" class="scavenged"/><text x="916" y="660" class="label center">R2</text>
    <rect x="966" y="628" width="74" height="53" rx="6" class="free"/><text x="1003" y="660" class="label center">R3</text>
    <rect x="1053" y="628" width="74" height="53" rx="6" class="used"/><text x="1090" y="660" class="label center" style="fill:#fff">R4</text>
    <rect x="1140" y="628" width="74" height="53" rx="6" class="free"/><text x="1177" y="660" class="label center">R5</text>
    <rect x="1227" y="628" width="74" height="53" rx="6" class="used"/><text x="1264" y="660" class="label center" style="fill:#fff">R6</text>
    <rect x="1314" y="628" width="74" height="53" rx="6" class="free"/><text x="1351" y="660" class="label center">R7</text>
    <text x="1420" y="660" class="mono">… R2047</text>
  </g>
  <text x="608" y="723" class="mono">allocBits_</text>
  <text x="742" y="723" class="mono center">1</text><text x="829" y="723" class="mono center">0</text><text x="916" y="723" class="mono center">0</text><text x="1003" y="723" class="mono center">0</text><text x="1090" y="723" class="mono center">1</text><text x="1177" y="723" class="mono center">0</text><text x="1264" y="723" class="mono center">1</text><text x="1351" y="723" class="mono center">0</text>
  <text x="608" y="760" class="mono">scavengedBits_</text>
  <text x="742" y="760" class="mono center">0</text><text x="829" y="760" class="mono center">0</text><text x="916" y="760" class="mono center">1</text><text x="1003" y="760" class="mono center">0</text><text x="1090" y="760" class="mono center">0</text><text x="1177" y="760" class="mono center">0</text><text x="1264" y="760" class="mono center">0</text><text x="1351" y="760" class="mono center">0</text>
  <rect x="600" y="792" width="900" height="50" rx="8" class="summary"/>
  <text x="625" y="814" class="monoSmall">ChunkSummary{start, max, end} × 32</text>
  <text x="625" y="835" class="text">view.maxFreeRun_ 预筛候选 Segment；随后用 allocBits 精确验证连续 span。</text>
  <path d="M515 700 H563" class="blue"/>

  <rect x="1595" y="535" width="540" height="330" rx="13" class="note"/>
  <text x="1865" y="571" class="label center">两张位图的约束与语义</text>
  <text x="1625" y="618" class="mono">alloc=1, scavenged=0</text><text x="1860" y="618" class="text">已交给上层，页驻留</text>
  <text x="1625" y="658" class="mono">alloc=0, scavenged=0</text><text x="1860" y="658" class="text">hot-free，可直接再发放</text>
  <text x="1625" y="698" class="mono">alloc=0, scavenged=1</text><text x="1860" y="698" class="text">空闲但已释放物理页</text>
  <text x="1625" y="740" class="mono">alloc=1, scavenged=1</text><text x="1860" y="740" class="text">不是有效稳定状态</text>
  <path d="M1625 766 H2105" class="dash"/>
  <text x="1625" y="798" class="small">不变式：scavengedBits ⊆ freeBits，且 allocBits ∩ scavengedBits = ∅。</text>
  <text x="1625" y="830" class="small">位图不记录对象 slot/size class；这些属于 MSRegionInfo、P 与 CentralRegionPool。</text>

  <text x="70" y="972" class="section">3. 一个 Region/span 的流转：Take → 上层使用 → Reclaim → Scavenge → Reuse</text>
  <rect x="70" y="995" width="2100" height="480" rx="15" class="panel"/>

  <rect x="105" y="1030" width="320" height="112" rx="12" class="request"/>
  <text x="265" y="1067" class="label center">P / Central 请求 Region 或 span</text>
  <text x="265" y="1097" class="small center">MSRegionManager::TakeRegions(num, homeShard)</text>
  <text x="265" y="1121" class="small center">small refill 或 large span 都走这里</text>
  <path d="M425 1085 H480" class="blue"/>

  <rect x="500" y="1025" width="545" height="122" rx="12" class="callout"/>
  <text x="772" y="1060" class="label center">FreeManager::TryTakeRegions</text>
  <text x="528" y="1090" class="text">① single：先取 receiver 的 borrowedSpans_</text>
  <text x="528" y="1117" class="text">② home shard：fast hint / takeCursor / reclaimCursor / bitmap</text>
  <text x="528" y="1144" class="text">③ 不足：single 批量 steal 或连续 span 从 donor 精确取 run</text>
  <path d="M1045 1085 H1100" class="purple"/>

  <rect x="1120" y="1025" width="455" height="122" rx="12" class="request"/>
  <text x="1347" y="1060" class="label center">命中 free Region/span</text>
  <text x="1148" y="1090" class="text">hot-free：锁内 MarkAllocated，置 alloc=1</text>
  <text x="1148" y="1117" class="text">scavenged：锁内置 alloc=1、清 scavenged=0</text>
  <text x="1148" y="1144" class="text">解锁后才 ReuseUnits()，再交给 P / Central</text>
  <path d="M1575 1085 H1630" class="green"/>

  <rect x="1650" y="1025" width="450" height="122" rx="12" class="note"/>
  <text x="1875" y="1060" class="label center">没有 fit：GrowForRegions</text>
  <text x="1678" y="1090" class="text">在 growMutex 下追加 64 MB Segment（连续 span 可连加）</text>
  <text x="1678" y="1117" class="text">建立 owner view、位图/summary；回调 Reset 新 RegionInfo</text>
  <text x="1678" y="1144" class="text">新 Segment 初始全 free，仍保持既有虚拟地址不动</text>
  <path d="M1875 1147 V1180 H1348 V1149" class="orange"/>

  <rect x="130" y="1245" width="430" height="148" rx="12" class="used"/>
  <text x="345" y="1282" class="label center" style="fill:#fff">上层占用 / allocated</text>
  <text x="345" y="1314" class="mono center" style="fill:#fff">alloc=1, scavenged=0</text>
  <text x="345" y="1344" class="small center" style="fill:#fff">P active、P empty、Central 链、large live/hot cache 等</text>
  <text x="345" y="1371" class="small center" style="fill:#fff">FreeManager 不可再次发放</text>

  <rect x="840" y="1245" width="430" height="148" rx="12" class="free"/>
  <text x="1055" y="1282" class="label center">FreeManager hot-free</text>
  <text x="1055" y="1314" class="mono center">alloc=0, scavenged=0</text>
  <text x="1055" y="1344" class="small center">逻辑资源已归还；物理页仍驻留，后续分配可直接复用</text>
  <text x="1055" y="1371" class="small center">按 Segment 边界分组后写回原 owner shard</text>

  <rect x="1550" y="1245" width="430" height="148" rx="12" class="scavenged"/>
  <text x="1765" y="1282" class="label center">Scavenged free</text>
  <text x="1765" y="1314" class="mono center">alloc=0, scavenged=1</text>
  <text x="1765" y="1344" class="small center">地址、Segment 与 view 保留；只记录物理页已释放请求</text>
  <text x="1765" y="1371" class="small center">下次被 Take 时恢复页后再交付</text>

  <path d="M560 1319 H830" class="purple"/>
  <text x="695" y="1241" class="small center">Reclaim：从 P/Central 摘除 → Reset RegionInfo → ReclaimRegionsReleased</text>
  <path d="M1270 1319 H1540" class="green"/>
  <text x="1405" y="1241" class="small center">Background Scavenge：retained 超阈值 → ReleaseUnits → MarkScavenged</text>
  <path d="M1550 1408 C1420 1460, 650 1460, 560 1408" class="blue"/>
  <text x="1055" y="1451" class="small center">再次分配：hot-free 直接 MarkAllocated；scavenged-free 清位、锁外 ReuseUnits。Scavenge 不 detach view、不移动对象地址。</text>

  <rect x="70" y="1500" width="2100" height="38" rx="10" fill="#f7f9fc" stroke="#b9c8da" stroke-width="1.5"/>
  <text x="110" y="1525" class="small">关键区分：Reclaim 改变逻辑所有权和 allocBits；Scavenge 只在空闲 Region 上改变物理驻留与 scavengedBits；Shrink 才可能移除完整空闲的堆尾 Segment。</text>
</svg>
