<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 1800 940" role="img" aria-labelledby="title desc">
  <title id="title">MSGC P/TLS and AllocBufferMS</title>
  <desc id="desc">A processor holds a mutator queue. Its current execution context reaches an AllocBufferMS through TLS. The buffer has 36 active region slots, a classless local empty cache, and an activeLog WorkBuf for the write barrier.</desc>
  <defs>
    <marker id="navy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#102d63"/></marker>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#2472d3"/></marker>
    <marker id="orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#e87505"/></marker>
    <style>
      .frame{fill:#fff;stroke:#102d63;stroke-width:3}.panel{fill:#f8fbff;stroke:#102d63;stroke-width:3;rx:12}.sub{fill:#fff;stroke:#2472d3;stroke-width:2.5;rx:9}.field{fill:#fff;stroke:#6c7789;stroke-width:2;rx:7}.region{fill:#eaf3ff;stroke:#2472d3;stroke-width:2;rx:7}.empty{fill:#f5f7fa;stroke:#6c7789;stroke-width:2;rx:7}.log{fill:#fff6e9;stroke:#e87505;stroke-width:3;rx:8}.label{fill:#102d63;font:700 28px Arial, PingFang SC, sans-serif;text-anchor:middle;dominant-baseline:middle}.h{fill:#102d63;font:700 24px Arial, PingFang SC, sans-serif;text-anchor:middle;dominant-baseline:middle}.s{fill:#102d63;font:600 19px Arial, PingFang SC, sans-serif;text-anchor:middle;dominant-baseline:middle}.xs{fill:#102d63;font:500 16px Arial, PingFang SC, sans-serif;text-anchor:middle;dominant-baseline:middle}.blue{fill:#2472d3;font:700 20px Arial, PingFang SC, sans-serif;text-anchor:middle;dominant-baseline:middle}.orange{fill:#e87505;font:700 20px Arial, PingFang SC, sans-serif;text-anchor:middle;dominant-baseline:middle}.note{fill:#102d63;font:italic 18px Arial, PingFang SC, sans-serif;text-anchor:middle}.arr{fill:none;stroke:#102d63;stroke-width:4;marker-end:url(#navy)}.barr{fill:none;stroke:#2472d3;stroke-width:4;marker-end:url(#blue)}.oarr{fill:none;stroke:#e87505;stroke-width:4;marker-end:url(#orange)}.dash{fill:none;stroke:#7890b8;stroke-width:2.5;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1800" height="940" fill="#fff"/>
  <text class="label" x="900" y="42">P / TLS 层：Mutator、AllocBufferMS 与写屏障日志</text>

  <!-- P and mutators -->
  <rect class="panel" x="65" y="105" width="350" height="690"/>
  <text class="label" x="240" y="145">Processor P₀</text>
  <text class="note" x="240" y="178">一个执行 P 可调度多个 Mutator</text>
  <rect class="sub" x="105" y="225" width="270" height="300"/>
  <text class="h" x="240" y="260">Mutator 队列</text>
  <rect class="field" x="132" y="294" width="216" height="45"/><text class="s" x="240" y="317">M₀（当前运行）</text>
  <rect class="field" x="132" y="356" width="216" height="45"/><text class="s" x="240" y="379">M₁（就绪）</text>
  <rect class="field" x="132" y="418" width="216" height="45"/><text class="s" x="240" y="441">M₂ · · · Mₙ</text>
  <path class="arr" d="M240 525 L240 625"/>
  <rect class="field" x="105" y="640" width="270" height="96"/>
  <text class="h" x="240" y="674">当前 OS 线程 TLS</text>
  <text class="s" x="240" y="706">ThreadLocalData</text>
  <text class="xs" x="240" y="726">执行上下文进入 Runtime 的入口</text>

  <!-- TLS pointer -->
  <rect class="sub" x="500" y="180" width="250" height="125"/>
  <text class="h" x="625" y="218">TLS 字段</text>
  <text class="blue" x="625" y="252">msAllocBuffer</text>
  <text class="xs" x="625" y="278">单个 AllocBufferMS* 指针</text>
  <path class="arr" d="M375 688 L500 250"/>
  <path class="barr" d="M750 250 L820 250"/>
  <text class="note" x="782" y="228">惰性创建</text>

  <!-- AllocBuffer -->
  <rect class="panel" x="820" y="88" width="910" height="735"/>
  <text class="label" x="1275" y="128">native heap 中的 AllocBufferMS（当前 P / TLS 独占）</text>
  <rect class="sub" x="855" y="165" width="535" height="430"/>
  <text class="h" x="1122" y="198">activeRegions_[36]</text>
  <text class="note" x="1122" y="224">数组下标与全局 size class / 中央 bucket 完全一致</text>
  <!-- 36 size classes -->
  <g>
    <rect class="region" x="880" y="255" width="72" height="50"/><text class="xs" x="916" y="277">0 · 8B</text>
    <rect class="region" x="960" y="255" width="72" height="50"/><text class="xs" x="996" y="277">1 · 16B</text>
    <rect class="region" x="1040" y="255" width="72" height="50"/><text class="xs" x="1076" y="277">2 · 24B</text>
    <rect class="region" x="1120" y="255" width="72" height="50"/><text class="xs" x="1156" y="277">3 · 32B</text>
    <rect class="region" x="1200" y="255" width="72" height="50"/><text class="xs" x="1236" y="277">4 · 48B</text>
    <rect class="region" x="1280" y="255" width="85" height="50"/><text class="xs" x="1322" y="277">… · 128B</text>
    <rect class="region" x="880" y="315" width="72" height="50"/><text class="xs" x="916" y="337">10 · 160</text>
    <rect class="region" x="960" y="315" width="72" height="50"/><text class="xs" x="996" y="337">… · 512</text>
    <rect class="region" x="1040" y="315" width="72" height="50"/><text class="xs" x="1076" y="337">18 · 640</text>
    <rect class="region" x="1120" y="315" width="72" height="50"/><text class="xs" x="1156" y="337">… · 2KB</text>
    <rect class="region" x="1200" y="315" width="72" height="50"/><text class="xs" x="1236" y="337">26 · 2.5K</text>
    <rect class="region" x="1280" y="315" width="85" height="50"/><text class="xs" x="1322" y="337">… · 8KB</text>
    <rect class="region" x="880" y="375" width="145" height="50"/><text class="xs" x="952" y="397">33 · 10KB</text>
    <rect class="region" x="1036" y="375" width="145" height="50"/><text class="xs" x="1108" y="397">34 · 12KB</text>
    <rect class="region" x="1192" y="375" width="173" height="50"/><text class="xs" x="1278" y="397">35 · 16KB</text>
  </g>
  <text class="s" x="1122" y="462">每个 class 槽：一个 `MSRegionInfo*`，或 `nullptr`</text>
  <path class="barr" d="M955 525 L955 570"/><path class="barr" d="M1120 525 L1120 570"/><path class="barr" d="M1280 525 L1280 570"/>
  <rect class="region" x="868" y="570" width="174" height="70"/><text class="blue" x="955" y="598">active Region [0]</text><text class="xs" x="955" y="621">32KB / 8B slots</text>
  <rect class="region" x="1033" y="570" width="174" height="70"/><text class="blue" x="1120" y="598">active Region [cls]</text><text class="xs" x="1120" y="621">32KB / typed slots</text>
  <rect class="region" x="1193" y="570" width="174" height="70"/><text class="blue" x="1280" y="598">active Region [35]</text><text class="xs" x="1280" y="621">32KB / 16KB slots</text>

  <!-- Other P-local fields -->
  <rect class="empty" x="1425" y="165" width="270" height="130"/>
  <text class="h" x="1560" y="198">localEmptyRegionCache_</text>
  <text class="s" x="1560" y="230">classless empty Region 链</text>
  <text class="xs" x="1560" y="260">最多 36；仍由本地缓存持有</text>
  <text class="xs" x="1560" y="281">尚未归还 FreeManager</text>
  <rect class="log" x="1425" y="330" width="270" height="145"/>
  <text class="h" x="1560" y="365">activeLog_ · WorkBuf</text>
  <text class="orange" x="1560" y="398">当前 P 的 barrier log</text>
  <text class="xs" x="1560" y="428">old edge / 待扫描对象入缓冲</text>
  <text class="xs" x="1560" y="451">ABI 固定 offset 896</text>
  <rect class="field" x="1425" y="510" width="270" height="112"/>
  <text class="h" x="1560" y="544">其余本地状态</text>
  <text class="s" x="1560" y="576">central_ · home shard · roots</text>
  <text class="xs" x="1560" y="602">Mark / Sweep debt、gcWork、统计</text>
  <rect class="field" x="855" y="685" width="840" height="95"/>
  <text class="h" x="1275" y="718">所有权边界</text>
  <text class="s" x="1275" y="749">active Region 不在 Central 的四链中；但其 FreeManager allocBit 仍为 1</text>

  <!-- barrier path -->
  <rect class="log" x="500" y="455" width="250" height="112"/>
  <text class="h" x="625" y="488">写字段</text>
  <text class="orange" x="625" y="519">Mark barrier</text>
  <text class="xs" x="625" y="545">记录 old edge</text>
  <path class="oarr" d="M750 511 L790 511 L790 660 L1400 660 L1400 402 L1425 402"/>

  <text class="note" x="900" y="884">36 个 active 槽和 barrier WorkBuf 都是 P/TLS 局部状态；中央池借由 registry 在 GC 边界统一观察它们。</text>
</svg>
