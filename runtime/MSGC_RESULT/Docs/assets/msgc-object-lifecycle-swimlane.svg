<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="940" viewBox="0 0 2050 940" role="img" aria-labelledby="title desc">
  <title id="title">MSGC object lifecycle swimlane</title>
  <desc id="desc">A four-lane MSGC object lifecycle. The write barrier points directly to activeLog WorkBuf, and the marked NO branch points directly to dead slot.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#102d63"/></marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#2472d3"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#e87505"/></marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#168542"/></marker>
    <style>
      .frame { fill:#ffffff; stroke:#102d63; stroke-width:3; }
      .lane { fill:#fbfcff; stroke:#102d63; stroke-width:3; }
      .lane-title { fill:#102d63; font:700 27px Arial, sans-serif; text-anchor:middle; }
      .title { fill:#102d63; font:700 34px Arial, sans-serif; text-anchor:middle; }
      .box { fill:#ffffff; stroke:#102d63; stroke-width:3; rx:10; }
      .box-blue { fill:#f5f9ff; stroke:#2472d3; stroke-width:3; rx:10; }
      .box-orange { fill:#fff8f0; stroke:#e87505; stroke-width:3; rx:10; }
      .box-green { fill:#f4fbf6; stroke:#168542; stroke-width:3; rx:10; }
      .label { fill:#102d63; font:700 24px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .label-small { fill:#102d63; font:600 20px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .label-blue { fill:#2472d3; font:700 24px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .label-orange { fill:#e87505; font:700 24px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .label-green { fill:#168542; font:700 23px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle; }
      .note { fill:#102d63; font:italic 20px Arial, sans-serif; text-anchor:middle; }
      .arrow { fill:none; stroke:#102d63; stroke-width:4; marker-end:url(#arrow-navy); }
      .arrow-blue { fill:none; stroke:#2472d3; stroke-width:4; marker-end:url(#arrow-blue); }
      .arrow-orange { fill:none; stroke:#e87505; stroke-width:4; marker-end:url(#arrow-orange); }
      .arrow-green { fill:none; stroke:#168542; stroke-width:4; marker-end:url(#arrow-green); }
      .dash { fill:none; stroke:#7890b8; stroke-width:2.5; stroke-dasharray:8 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="2050" height="940" fill="#ffffff"/>
  <rect class="frame" x="6" y="68" width="2038" height="824" rx="4"/>
  <text class="title" x="1015" y="42">Object lifecycle in MSGC</text>
  <line class="arrow" x1="230" y1="68" x2="1870" y2="68"/>
  <text class="title" x="1050" y="58">Time</text>

  <rect class="lane" x="6" y="68" width="220" height="190"/>
  <rect class="lane" x="6" y="258" width="220" height="180"/>
  <rect class="lane" x="6" y="438" width="220" height="210"/>
  <rect class="lane" x="6" y="648" width="220" height="244"/>
  <line x1="226" y1="68" x2="226" y2="892" stroke="#102d63" stroke-width="3"/>
  <line x1="226" y1="258" x2="2044" y2="258" stroke="#102d63" stroke-width="3"/>
  <line x1="226" y1="438" x2="2044" y2="438" stroke="#102d63" stroke-width="3"/>
  <line x1="226" y1="648" x2="2044" y2="648" stroke="#102d63" stroke-width="3"/>
  <text class="lane-title" x="116" y="160">Mutator / P</text>
  <text class="lane-title" x="116" y="334">Region /</text>
  <text class="lane-title" x="116" y="368">Allocator</text>
  <text class="lane-title" x="116" y="532">GC Mark</text>
  <text class="lane-title" x="116" y="745">Sweep /</text>
  <text class="lane-title" x="116" y="779">FreeManager</text>

  <!-- Allocation and stable address -->
  <rect class="box" x="270" y="132" width="180" height="70"/>
  <text class="label" x="360" y="167">Allocate object</text>
  <path class="arrow" d="M360 202 L360 302"/>
  <rect class="box" x="270" y="302" width="180" height="82"/>
  <text class="label-small" x="360" y="337">BUMP or</text>
  <text class="label-small" x="360" y="362">bitmap slot</text>
  <path class="arrow" d="M450 343 L535 343"/>
  <rect class="box-blue" x="535" y="302" width="190" height="82"/>
  <text class="label-blue" x="630" y="337">same address</text>
  <text class="note" x="630" y="414">stable address</text>

  <!-- GC request and barrier -->
  <rect class="box" x="505" y="132" width="165" height="70"/>
  <text class="label" x="587" y="167">GC request</text>
  <path class="arrow" d="M450 167 L505 167"/>
  <path class="dash" d="M587 202 L587 482"/>
  <rect class="box" x="760" y="120" width="190" height="94"/>
  <text class="label-small" x="855" y="153">Write barrier:</text>
  <text class="label-small" x="855" y="182">old edge</text>

  <!-- Mark work chain -->
  <rect class="box" x="505" y="475" width="145" height="72"/>
  <text class="label" x="577" y="511">EnumRoots</text>
  <rect class="box" x="700" y="462" width="200" height="98"/>
  <text class="label-small" x="800" y="496">activeLog /</text>
  <text class="label-small" x="800" y="522">WorkBuf</text>
  <rect class="box" x="950" y="475" width="180" height="72"/>
  <text class="label" x="1040" y="511">ConcurrentMark</text>
  <text class="note" x="1040" y="580">mark bitmap</text>
  <rect class="box" x="1180" y="475" width="190" height="72"/>
  <text class="label-small" x="1275" y="511">MarkTermination</text>
  <path class="arrow" d="M650 511 L700 511"/>
  <path class="arrow" d="M900 511 L950 511"/>
  <path class="arrow" d="M1130 511 L1180 511"/>

  <!-- Exact barrier-to-log arrow: same x coordinate, direct endpoint -->
  <path class="arrow" d="M855 214 L855 438 L800 438 L800 462"/>
  <text class="note" x="925" y="420">old edge published</text>

  <!-- Marked decision and live branch -->
  <path d="M1450 458 L1515 511 L1450 564 L1385 511 Z" fill="#ffffff" stroke="#102d63" stroke-width="3"/>
  <text class="label" x="1450" y="511">marked?</text>
  <path class="arrow" d="M1370 511 L1385 511"/>
  <rect class="box-blue" x="1555" y="475" width="165" height="72"/>
  <text class="label-blue" x="1637" y="511">live object</text>
  <rect class="box-blue" x="1770" y="475" width="185" height="72"/>
  <text class="label-blue" x="1862" y="511">kept in Region</text>
  <path class="arrow-blue" d="M1515 511 L1555 511"/>
  <text fill="#2472d3" font-family="Arial, sans-serif" font-size="20" font-weight="700" x="1527" y="492">YES</text>
  <path class="arrow-blue" d="M1720 511 L1770 511"/>

  <!-- Exact marked NO branch: direct vertical arrow to dead slot -->
  <rect class="box-orange" x="1375" y="690" width="150" height="76"/>
  <text class="label-orange" x="1450" y="728">dead slot</text>
  <path class="arrow-orange" d="M1450 564 L1450 690"/>
  <text fill="#e87505" font-family="Arial, sans-serif" font-size="20" font-weight="700" x="1465" y="620">NO</text>

  <!-- Sweep and physical-page path -->
  <rect class="box-orange" x="1570" y="690" width="170" height="76"/>
  <text class="label-orange" x="1655" y="719">Sweep:</text>
  <text class="label-orange" x="1655" y="745">reusable slot</text>
  <text class="note" x="1655" y="798">generation boundary</text>
  <rect class="box" x="1785" y="690" width="150" height="76"/>
  <text class="label-small" x="1860" y="719">empty Region</text>
  <text class="label-small" x="1860" y="745">cache</text>
  <rect class="box-green" x="1710" y="810" width="135" height="60"/>
  <text class="label-green" x="1777" y="840">Reclaim</text>
  <rect class="box-green" x="1880" y="810" width="145" height="60"/>
  <text class="label-green" x="1952" y="832">Scavenge:</text>
  <text class="label-green" x="1952" y="852">page released</text>
  <path class="arrow-orange" d="M1525 728 L1570 728"/>
  <path class="arrow" d="M1740 728 L1785 728"/>
  <path class="arrow-green" d="M1860 766 L1860 840 L1845 840"/>
  <path class="arrow-green" d="M1845 840 L1880 840"/>

  <rect x="690" y="838" width="500" height="58" rx="8" fill="#ffffff" stroke="#102d63" stroke-width="3"/>
  <text class="title" x="940" y="877">dead object != RSS drop</text>
</svg>
